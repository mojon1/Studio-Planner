<meta charset="utf-8">
<title>Studio Planner — スタジオ撮影の下見と打合せ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="スタジオの広さ、演者の立ち位置、カメラの画角、反射面の映り込みをブラウザで確かめて、A4 の図面と共有リンクにする。登録もインストールも不要。">

</script>
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1d2027; --ink2:#4d5364; --muted:#858c9c; --rule:#d8dbe2;
  --accent:#c2711f; --accent-bg:#fbeedd; --accent-ink:#8f5010;
  --btn:#f3f4f7; --btn-on:#1d2027; --btn-on-ink:#ffffff; --danger:#a83a3a;
  --viewport:#2a2d34;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --panel:#1f2228; --ink:#eceef2; --ink2:#c0c5cf; --muted:#858c9c; --rule:#353942;
    --accent:#e29a44; --accent-bg:#3a2a17; --accent-ink:#f2b76b;
    --btn:#2a2e36; --btn-on:#eceef2; --btn-on-ink:#15171b; --danger:#e07b7b;
    --viewport:#0f1114;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --panel:#1f2228; --ink:#eceef2; --ink2:#c0c5cf; --muted:#858c9c; --rule:#353942;
  --accent:#e29a44; --accent-bg:#3a2a17; --accent-ink:#f2b76b;
  --btn:#2a2e36; --btn-on:#eceef2; --btn-on-ink:#15171b; --danger:#e07b7b;
  --viewport:#0f1114;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.5}
#app{position:fixed;inset:0;display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr}
#view{position:relative;background:var(--viewport);touch-action:none;overflow:hidden}
#view canvas{display:block;width:100%;height:100%}
#view.drop::after{content:"ここに落とすと取り込みます";position:absolute;inset:8px;border:3px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(20,22,26,.55);font-weight:700;z-index:6;pointer-events:none}
#panel{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;z-index:2}
/* パネルは一回り小さく。rem と px が混在しているので、まとめて縮めるのは zoom がいちばん確実 */
#tabs,#sheet{zoom:.78}
#tabs{display:flex;border-bottom:1px solid var(--rule);flex:none}
#tabs button{flex:1;height:48px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
#tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
#gear{position:absolute;left:80px;bottom:20px;z-index:4;width:44px;height:44px;border:0;border-radius:50%;background:rgba(20,22,26,.8);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(6px)}
#gear.on{background:var(--accent)}
#gear:focus-visible{outline:3px solid #fff;outline-offset:2px}
body.viewer #gear{display:none}
body.folded:not(.viewer) #panel{display:none}
body.folded:not(.viewer) #app{grid-template-columns:1fr}
#sheet{overflow-y:auto;padding:14px 16px 24px;flex:1;min-height:0}
#selbody:not(:empty){margin-top:18px;padding-top:16px;border-top:2px solid var(--rule)}
.sec{display:none}.sec.on{display:block}
h2{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;font-weight:700}
h2:first-child{margin-top:0}
.hint{font-size:.82rem;color:var(--ink2);margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.btn{min-height:44px;padding:8px 14px;border:1px solid var(--rule);background:var(--btn);color:var(--ink);border-radius:8px;font:inherit;font-weight:500;cursor:pointer;flex:1 1 auto;text-align:center}
.btn.on{background:var(--btn-on);color:var(--btn-on-ink);border-color:var(--btn-on)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--danger)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{transform:translateY(1px)}
label.f{display:grid;grid-template-columns:5.5em 1fr auto;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}
label.f .v{font-family:"IBM Plex Mono",monospace;font-size:.85rem;min-width:5.6em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
label.f button.v{border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 6px;cursor:text;font-weight:500}
label.f button.v:hover{border-color:var(--rule);background:var(--btn)}
label.f button.v:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f input.vedit{height:32px;padding:0 6px;text-align:right;width:5.6em;min-width:5.6em;flex:0 0 auto}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
input[type=number],select,input[type=text]{height:40px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;padding:0 10px;width:100%}
input[type=color]{width:56px;height:44px;border:1px solid var(--rule);border-radius:8px;background:var(--btn);padding:2px}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.swatches button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.row.saved .btn{min-height:40px;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px;flex:1 1 40%}
.row.saved .btn small{color:var(--muted);font-size:.75rem;font-family:"IBM Plex Mono",monospace}
.row.saved .btn.on small{color:inherit;opacity:.7}
.row.saved .btn.del{flex:0 0 40px;min-height:40px;padding:0;color:var(--danger);font-size:1.1rem}
.row.nm input[type=text]{flex:1 1 7em;width:auto;min-width:0}
.row.nm .btn{flex:0 0 auto}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dims label{font-size:.8rem;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:6px}
.itemrow{display:flex;gap:6px;align-items:stretch}
.itemrow>button.name{flex:1;display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:6px 12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer;text-align:left;min-width:0}
.itemrow>button.name.on{border-color:var(--accent);background:var(--accent-bg)}
.itemrow>button.name>span,.itemrow>button.name>small{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemrow>button.name>small{margin-left:8px}
.itemrow .eye{flex:0 0 44px;border:1px solid var(--rule);background:var(--panel);color:var(--ink2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.itemrow.hidden-item>button.name{opacity:.45}
.itemrow.hidden-item .eye{color:var(--muted)}
.itemrow .ico{flex:0 0 36px;border:1px solid var(--rule);background:var(--panel);color:var(--ink2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.itemrow .ico.on{color:var(--accent);border-color:var(--accent)}
.itemrow .ico.trash:hover{color:var(--danger)}
.itemrow .grip{flex:0 0 20px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.itemrow.dragging{opacity:.5}
.itemrow.dropbefore{box-shadow:0 -3px 0 -1px var(--accent)}
.itemrow.dropafter{box-shadow:0 3px 0 -1px var(--accent)}
.itemrow.locked-item>button.name{border-style:dashed}
.itemrow input.ren{flex:1;min-width:0;height:auto;min-height:44px}
/* display は id 指定なので、そのままだと UA の [hidden]{display:none} に勝ってしまい、
   空のメニューが常に小さな棒として画面に残る（前回開いた場所に貼り付く） */
#ctx{position:fixed;z-index:60;min-width:150px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:6px;display:flex;flex-direction:column;gap:2px}
#ctx[hidden]{display:none}
#ctx button{min-height:42px;padding:0 14px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:10px}
#ctx button:hover{background:var(--btn)}
#ctx button.danger{color:var(--danger)}
.list .sw{width:12px;height:12px;border-radius:50%;margin-right:10px;flex:none;display:inline-block}
.list small{color:var(--muted);font-size:.78rem}
#viewbtns{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:3}
#viewbtns button{height:40px;padding:0 14px;border:0;border-radius:8px;background:rgba(20,22,26,.75);color:#fff;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;backdrop-filter:blur(6px)}
#viewbtns button.on{background:var(--accent)}
#viewbtns button.icon{padding:0;width:40px;display:flex;align-items:center;justify-content:center}
#viewbtns button.icon:not(.on){color:#b9bec9}
#info{position:absolute;top:10px;right:10px;z-index:3;font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:#fff;background:rgba(20,22,26,.75);padding:6px 10px;border-radius:8px;white-space:pre;line-height:1.5;backdrop-filter:blur(6px)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#labels span{position:absolute;transform:translate(-50%,-50%);font-family:"IBM Plex Mono",monospace;font-size:.74rem;font-weight:500;color:#fff;background:rgba(20,22,26,.72);padding:1px 6px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
#labels span.dim{color:#ffd9a8}
#labels span.dist{color:#fff;background:rgba(194,113,31,.85)}
#pip{position:absolute;z-index:4;border:2px solid rgba(255,255,255,.7);border-radius:6px;background:transparent;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.4);overflow:hidden;user-select:none;-webkit-user-select:none}
#pip .bar{height:24px;background:rgba(20,22,26,.85);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;cursor:move;display:flex;justify-content:space-between;align-items:center;user-select:none}
#pip .bar small{font-weight:400;color:#bbb;font-family:"IBM Plex Mono",monospace;margin-left:auto}
#pip .bar button{margin-left:8px;width:22px;height:20px;border:0;border-radius:4px;background:transparent;color:#ddd;font-size:.8rem;line-height:1;cursor:pointer;padding:0}
#pip .bar button:hover{background:rgba(255,255,255,.18)}
#pip .body{position:absolute;left:0;right:0;top:24px;bottom:0;cursor:grab}
#pip .grip{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.8) 50%);border-bottom-right-radius:4px}
#addfab{position:absolute;left:12px;bottom:12px;z-index:4;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:1.9rem;line-height:1;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:0}
#addfab:active{transform:translateY(1px)}
#addfab:focus-visible{outline:3px solid #fff;outline-offset:2px}
body.viewer #addfab{display:none}
#addpop,#namedlg{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:22;display:none;align-items:center;justify-content:center;padding:16px}
#addpop.on,#namedlg.on{display:flex}
#addpop .pop,#namedlg .pop{background:var(--panel);border-radius:14px;width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#addpop .pophead,#namedlg .pophead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 12px 16px;border-bottom:1px solid var(--rule)}
#addpop .pophead button,#namedlg .pophead button{width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font:inherit;font-size:1.1rem;cursor:pointer}
#addpop .popbody,#namedlg .popbody{padding:14px 16px 20px;overflow-y:auto}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.people button{border:1px solid var(--rule);background:var(--btn);border-radius:8px;padding:4px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.people button:active{transform:translateY(1px)}
.people button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.people img{width:100%;height:auto;display:block;pointer-events:none}
.people small{font-size:.66rem;color:var(--ink2);line-height:1.2}
.people button.on{border-color:var(--accent);background:var(--accent-bg)}
.poses{grid-template-columns:repeat(3,1fr)}
.disc{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:16px 0 8px;cursor:pointer;
  color:var(--muted);font:inherit;font-weight:700;font-size:.8rem;letter-spacing:.08em}
.disc small{margin-left:auto;color:var(--ink2);font-weight:500;letter-spacing:0;font-size:.82rem}
.disc b{color:var(--ink2);font-size:.9rem;transition:transform .15s}
.disc[aria-expanded="true"] b{transform:rotate(180deg)}
.disc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#namedlg .pop{width:min(420px,100%)}
#namein{font-family:"IBM Plex Mono",monospace;font-size:.85rem;margin-bottom:4px}
#toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:#1d2027;color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:5;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#shot{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#shot.show{display:flex}
#shot img{max-width:100%;max-height:75vh;border:1px solid #555}
#shot p{color:#ddd;font-size:.85rem;margin:0}
#shot .row{justify-content:center}
#linkbox{font-family:"IBM Plex Mono",monospace;font-size:.75rem}
#viewerbar{display:none;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3}
body.viewer #panel{display:none}
body.viewer #app{grid-template-columns:1fr}
body.viewer #viewerbar{display:block}
label.f2{display:block;margin:8px 0;font-size:.85rem;color:var(--ink2)}
label.f2 span{display:block;margin-bottom:4px}
label.f2 input,label.f2 textarea{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;padding:8px 10px}
label.f2 input{height:40px}
label.f2 textarea{resize:vertical;line-height:1.5}
/* --- the printed sheet ---------------------------------------------------------- */
#papermodal{position:fixed;inset:0;z-index:30;background:#3a3d44;display:none;flex-direction:column}
#papermodal.show{display:flex}
.pmbar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#22252c;border-bottom:1px solid #000}
.pmbar .btn{flex:0 0 auto;min-height:40px}
.pmhint{color:#c8ccd4;font-size:.82rem}
.pmscroll{flex:1;overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}
#paper{background:#fff;color:#15171b;box-shadow:0 6px 30px rgba(0,0,0,.5);transform-origin:top center;
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;padding:8mm;display:flex;flex-direction:column}
#paper.landscape{width:297mm;height:210mm}
#paper.portrait{width:210mm;height:297mm}
#paper *{box-sizing:border-box}
.ph{flex:none;display:flex;align-items:flex-end;gap:8mm;border-bottom:1.2pt solid #15171b;padding-bottom:2.5mm}
.ph .pj{font-size:15pt;font-weight:700;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .pj em{display:block;font-style:normal;font-size:7pt;font-weight:500;color:#6b7280;letter-spacing:.1em}
.ph .cut{font-size:13pt;font-weight:700;border:1.2pt solid #15171b;padding:1mm 3mm;white-space:nowrap}
.ph .meta{text-align:right;font-size:7.5pt;color:#4b5563;line-height:1.6;white-space:nowrap}
.pbody{flex:1;display:flex;gap:5mm;min-height:0;padding-top:3mm}
#paper.portrait .pbody{flex-direction:column;gap:3mm}
.pviews{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
#paper.landscape .pviews{flex:0 0 186mm}
#paper.portrait .pviews{flex:0 0 146mm}
.pv{position:relative;border:.8pt solid #9ca3af;background:#eceef1;overflow:hidden;cursor:move;touch-action:none}
.pv[data-pane="cam"]{cursor:default}
.pvin{position:absolute;inset:0;transform-origin:center center}
.pv img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.pv .cap{position:absolute;left:0;top:0;background:#15171b;color:#fff;font-size:7pt;font-weight:700;padding:.6mm 2mm;letter-spacing:.06em}
.pv .lb{position:absolute;transform:translate(-50%,-50%);font-size:4.6pt;font-weight:700;background:rgba(255,255,255,.92);
  color:#15171b;border:.25pt solid #8a919c;padding:0 .5mm;white-space:nowrap;border-radius:.5mm;line-height:1.5}
.pv .lb.dim{border-color:#b45309;color:#92400e}
.pv .lb.dist{background:#c2711f;border-color:#8f5010;color:#fff}
.pside{flex:1;display:flex;flex-direction:column;gap:3mm;min-width:0}
#paper.portrait .pside{flex:1;flex-direction:row;gap:4mm}
.pbox{border:.8pt solid #9ca3af;display:flex;flex-direction:column;min-height:0}
.pbox>h4{margin:0;font-size:7pt;font-weight:700;letter-spacing:.1em;background:#e5e7eb;color:#374151;padding:1mm 2mm;border-bottom:.4pt solid #9ca3af}
.pbox .inner{padding:1.5mm 2mm;font-size:8pt;line-height:1.55}
.prow{display:flex;justify-content:space-between;gap:3mm;border-bottom:.3pt dotted #b6bcc6;padding:.5mm 0}
.prow:last-child{border-bottom:0}
.prow .k{color:#6b7280;white-space:nowrap}
.prow .v{font-weight:700;text-align:right}
.pmemo{flex:1;min-height:18mm}
.pmemo .inner{flex:1;white-space:pre-wrap;font-size:8pt;line-height:2.1;
  background-image:repeating-linear-gradient(#fff 0 calc(2.1em - .3pt), #dfe3e9 calc(2.1em - .3pt) 2.1em)}
.pfoot{flex:none;padding-top:1.5mm;font-size:6.5pt;color:#9ca3af;display:flex;justify-content:space-between}
@media print{
  html,body{overflow:visible !important;height:auto !important;background:#fff !important}
  #app,#shot,#addpop,.pmbar{display:none !important}
  .pv{cursor:auto !important}
  #papermodal{position:static !important;display:block !important;background:#fff !important}
  .pmscroll{overflow:visible !important;padding:0 !important;display:block !important}
  #paper{transform:none !important;box-shadow:none !important;margin:0 !important;padding:0 !important;width:auto !important;height:auto !important}
  #paper.landscape{height:194mm !important}
  #paper.portrait{height:281mm !important}
}
@media (max-width:760px){
  #addpop,#namedlg{align-items:flex-end;padding:0}
  #addpop .pop,#namedlg .pop{width:100%;max-height:80vh;border-radius:14px 14px 0 0}
  #addfab{width:52px;height:52px;font-size:1.7rem}
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  body.folded:not(.viewer) #app{grid-template-rows:1fr}
  #panel{border-right:0;border-top:1px solid var(--rule);order:2;max-height:46vh}
  #view{order:1}

  RightShoulder:'Spine2', RightArm:'RightShoulder', RightForeArm:'RightArm', RightHand:'RightForeArm',
  LeftUpLeg:'Hips', LeftLeg:'LeftUpLeg', LeftFoot:'LeftLeg', LeftToeBase:'LeftFoot',
  RightUpLeg:'Hips', RightLeg:'RightUpLeg', RightFoot:'RightLeg', RightToeBase:'RightFoot'};
const POSE_PRIMARY = {Hips:'Spine', Spine2:'Neck', Head:'HeadTop_End'};   // 枝分かれする骨は、どの子で向きを決めるか
const POSE_ORDER = ['Hips','Spine','Spine1','Spine2','Neck','Head','LeftShoulder','LeftArm','LeftForeArm',
  'RightShoulder','RightArm','RightForeArm','LeftUpLeg','LeftLeg','LeftFoot','RightUpLeg','RightLeg','RightFoot'];
// 腕以外は「素の姿勢からどれだけ回ったか」で合わせる。絶対の向きで合わせると、2 つのリグで
// 骨の置き方が違うところがそのままズレになる。実際、Tripo の足首→つま先は水平なのに
// Mixamo は 39 度下向きで、全ポーズがつま先立ちになった。首も Mixamo は構造上 17 度前傾。
// 腕だけは絶対で合わせる。Mixamo は T ポーズ、Tripo は A ポーズで素の姿勢が同じ意味を
// 持たないため、差分にすると腕が 45 度余計に下がる。
const POSE_ABS = new Set(['LeftShoulder','LeftArm','LeftForeArm','RightShoulder','RightArm','RightForeArm']);
const poseFrame = (up, side) => {
  const y = up.clone().normalize();
  const x = side.clone().projectOnPlane(y).normalize();
  return new THREE.Matrix4().makeBasis(x, y, new V3().crossVectors(x, y).normalize());
};
// tools/make-poses.mjs にも同じものがある。片方を直したら両方直すこと。
function applyPose(root, pose){
  const src = {}, rst = {};
  POSES.joints.forEach((j, i) => { src[j] = new V3().fromArray(pose.p[i]); rst[j] = new V3().fromArray(POSES.rest[i]); });
  const boneOf = {}; root.traverse(o => { if (o.isBone) boneOf[o.name] = o; });
  const tb = {}; for (const [m, t] of Object.entries(POSE_MAP)) tb[m] = boneOf[t];
  const Q = THREE.Quaternion;
  const wq = o => o.getWorldQuaternion(new Q());
  const dir = (o, x, y) => o[x] && o[y] ? o[y].clone().sub(o[x]) : null;
  const kidOf = m => POSE_PRIMARY[m] || Object.keys(POSE_CHILD).find(k => POSE_CHILD[k] === m);
  // 目標は「この体の素の向きに、参照元が素から回ったぶんをかけたもの」。素の向きは
  // 親を回す前に控える。回した後の値を使うと親の回転を二重に数えて体が折れる。
  root.updateMatrixWorld(true);
  const tgtRest = {};
  for (const m of POSE_ORDER) if (tb[m]) tgtRest[m] = new V3(0,1,0).applyQuaternion(wq(tb[m])).normalize();
  for (const m of POSE_ORDER){
    const bone = tb[m]; if (!bone) continue;
    const kid = kidOf(m);
    const posed = dir(src, m, kid), restDir = dir(rst, m, kid);
    if (!kid || !posed || posed.lengthSq() < 1e-9) continue;
    const cur = wq(bone);
    const have = new V3(0,1,0).applyQuaternion(cur).normalize();
    let q;
    if (m === 'Hips' && restDir){
      // 腰は上下だけでは向きが決まらない。左右の軸も使って姿勢ごと回す。
      // 連鎖の根なので cur はまだ素の向きのまま
      const lr = o => o.LeftUpLeg.clone().sub(o.RightUpLeg);
      const R = new THREE.Matrix4().multiplyMatrices(poseFrame(posed, lr(src)), poseFrame(restDir, lr(rst)).transpose());
      q = new Q().setFromRotationMatrix(R).multiply(cur);
    } else {
      const want = restDir && !POSE_ABS.has(m)
        ? tgtRest[m].clone().applyQuaternion(new Q().setFromUnitVectors(restDir.normalize(), posed.clone().normalize()))
        : posed.clone().normalize();
      q = new Q().setFromUnitVectors(have, want.normalize()).multiply(cur);
    }
    bone.quaternion.copy(wq(bone.parent).invert().multiply(q));
    bone.updateMatrixWorld(true);
  }
  root.updateMatrixWorld(true);
}

const personModel = it => MODEL_BY_ID[it.model] ? `models/${it.model}.glb` : null;
const realPeople = new Map();                       // file -> Object3D | 'loading' | 'fail'
async function loadPerson(file){
  if (realPeople.has(file)) return;
  realPeople.set(file, 'loading');
  try {
    const r = await fetch(file);
    if (!r.ok) throw new Error(r.status + ' ' + file);
    const {obj} = await parseModel(await r.arrayBuffer(), 'glb', {});
    realPeople.set(file, obj);
  } catch(e){ console.warn('person model failed', e); realPeople.set(file, 'fail'); }
  for (const it of state.items) if (it.type === 'person' && personModel(it)) rebuildItem(it);
  renderSel(); needRender = true;
}

// Box3.setFromObject はスキニングを見ない。ジオメトリの箱を行列で移すだけなので、
// 骨を回しても外形が変わらず、座らせても身長ぶんの高さのままになる。
// SkinnedMesh.computeBoundingBox() は骨を通してから測ってくれるので、そちらを使う。
function posedBox(root){
  root.updateMatrixWorld(true);
  const box = new THREE.Box3(), tmp = new THREE.Box3();
  root.traverse(n => {
    if (!n.isMesh && !n.isSkinnedMesh) return;
    let local;
    if (n.isSkinnedMesh && n.computeBoundingBox){ n.computeBoundingBox(); local = n.boundingBox; }
    if (!local){ if (!n.geometry.boundingBox) n.geometry.computeBoundingBox(); local = n.geometry.boundingBox; }
    if (local) box.union(tmp.copy(local).applyMatrix4(n.matrixWorld));
  });
  return box;
}
const restH = new WeakMap();
function buildRealPerson(it, src){
  const g = new THREE.Group();
  const inst = skeletonClone(src);
  inst.updateMatrixWorld(true);
  // 縮尺は「立ったときの身長」から出す。座った姿勢の外形から出すと、座った人が
  // 身長ぶんの高さまで引き伸ばされて別人の大きさになる
  if (!restH.has(src)){ const b = posedBox(src); restH.set(src, b.max.y - b.min.y); }
  const k = restH.get(src) > 1e-4 ? it.height / restH.get(src) : 1;
  inst.scale.setScalar(k);
  const pose = it.posture && POSES ? poseById(it.posture) : null;
  if (pose) applyPose(inst, pose);
  const bb = posedBox(inst);
  inst.position.set(-(bb.min.x + bb.max.x)/2, -bb.min.y, -(bb.min.z + bb.max.z)/2);
  inst.traverse(n => {
    if (!n.isMesh && !n.isSkinnedMesh) return;
    n.castShadow = true; n.receiveShadow = true; n.frustumCulled = false;
    for (const m of (Array.isArray(n.material) ? n.material : [n.material])){
      if (!m?.isMeshStandardMaterial || m.envMap) continue;
      m.envMap = modelEnv(); m.envMapIntensity = 1; m.needsUpdate = true;
    }
  });
  g.add(inst);
  g.add(footDisc(Math.max(0.28, Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z)*0.55), COLORS.person));
  g.userData.top = bb.max.y - bb.min.y;      // 寸法ラベルは実際に描いた高さの上に出す
  return g;
}
function buildPerson(it){
  // only the standing pose exists as a scan; sitting and lying stay with the mannequin
  const file = personModel(it);
  if (file){
    const src = realPeople.get(file);
    if (src && src !== 'loading' && src !== 'fail') return buildRealPerson(it, src);
    if (!realPeople.has(file)) loadPerson(file);
  }
  const g = new THREE.Group(), R = personRig(it), c = mat(COLORS.person, {roughness:0.85});
  const H = R.H, hh = R.hh, sit = it.pose === 'sit';
  const upper = new THREE.Group();
  // torso is a lathe squashed in depth, so the cross-section reads as an ellipse
  const prof = [[R.hipW*0.30, R.yCrotch], [R.hipW*0.50, R.yHip], [R.waistW*0.50, R.yWaist],
    [R.chestW*0.50, R.yChest], [R.shW*0.46, R.yShoulder], [R.shW*0.28, R.yShoulder + H*0.03],
    [hh*0.19, R.yChin - hh*0.16]];
  const torso = shadowed(new THREE.Mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 22), c));
  torso.scale.z = 0.66; upper.add(torso);
  const head = shadowed(new THREE.Mesh(new THREE.SphereGeometry(hh*0.37, 18, 14), c));
  head.scale.set(0.95, 1.30, 1.02); head.position.y = H - hh*0.5; upper.add(head);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(hh*0.10, hh*0.18, 10), c);
  nose.rotation.x = Math.PI/2; nose.position.set(0, H - hh*0.55, hh*0.36); upper.add(nose);
  for (const s of [-1, 1]){
    const sh = new THREE.Vector3(s*R.shW*0.50, R.yShoulder, 0);
    const el = new THREE.Vector3(s*R.shW*0.54, R.yWaist, sit ? H*0.02 : 0);
    const wr = new THREE.Vector3(s*R.shW*0.58, R.yCrotch + H*0.02, sit ? H*0.10 : 0);
    upper.add(ball(sh.x, sh.y, sh.z, H*0.048, c), limb(sh, el, H*0.045, H*0.036, c),
              ball(el.x, el.y, el.z, H*0.036, c), limb(el, wr, H*0.034, H*0.026, c),
              ball(wr.x, wr.y, wr.z, H*0.026, c));
    const hand = shadowed(new THREE.Mesh(new THREE.BoxGeometry(H*0.030, H*0.075, H*0.018), c));
    hand.position.set(wr.x, wr.y - H*0.045, wr.z); upper.add(hand);
  }
  const legs = new THREE.Group();
  const legX = R.hipW*0.26, seat = clamp(H*0.26, 0.28, 0.48);
  for (const s of [-1, 1]){
    const hip = new THREE.Vector3(s*legX, sit ? seat : R.yCrotch, 0);
    const knee = sit ? new THREE.Vector3(s*legX, seat - H*0.015, R.yCrotch - R.yKnee) : new THREE.Vector3(s*legX, R.yKnee, 0);
    const ank = sit ? new THREE.Vector3(s*legX, R.yAnkle, knee.z) : new THREE.Vector3(s*legX*0.92, R.yAnkle, 0);
    legs.add(ball(hip.x, hip.y, hip.z, H*0.062, c), limb(hip, knee, H*0.072, H*0.050, c),
             ball(knee.x, knee.y, knee.z, H*0.050, c), limb(knee, ank, H*0.042, H*0.030, c),
             ball(ank.x, ank.y, ank.z, H*0.030, c));
    const foot = shadowed(new THREE.Mesh(new THREE.BoxGeometry(H*0.055, H*0.035, H*0.14), c));
    foot.position.set(ank.x, H*0.022, ank.z + H*0.045); legs.add(foot);
  }
  if (sit){
    upper.position.y = seat - R.yCrotch;
    const top = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(R.hipW*0.62, R.hipW*0.62, 0.04, 16), mat(0x6f7480)));
    top.position.y = seat - 0.02; legs.add(top);
    const post = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, seat-0.04, 10), mat(0x6f7480)));
    post.position.y = (seat-0.04)/2; legs.add(post);
  }
  const body = new THREE.Group(); body.add(upper, legs);
  if (it.pose === 'lie'){ body.rotation.x = -Math.PI/2; body.position.y = R.chestW*0.33; }
  g.add(body);
  if (it.pose === 'lie'){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(R.shW*1.15, H), new THREE.MeshBasicMaterial({color:COLORS.person, transparent:true, opacity:0.55}));
    m.rotation.x = -Math.PI/2; m.position.set(0, 0.006, -H*0.5 + R.yCrotch); m.userData.plan = true; g.add(m);
  } else g.add(footDisc(Math.max(0.28, R.shW*0.7), COLORS.person));
  return g;
}

function extrudeProfile(pts, L, Hh, width, m, closeBottom){
  const s = new THREE.Shape();
  pts.forEach(([u,v], i) => i ? s.lineTo(u*L - L/2, v*Hh) : s.moveTo(u*L - L/2, v*Hh));
  if (closeBottom) s.lineTo(pts[0][0]*L - L/2, pts[0][1]*Hh);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, {depth:width, bevelEnabled:true, bevelSize:0.02, bevelThickness:0.02, bevelSegments:2});
  geo.translate(0, 0, -width/2);
  return shadowed(new THREE.Mesh(geo, m));
}
function buildCar(it){
  const g = new THREE.Group(), car = new THREE.Group();
  const L = it.d, W = it.w, Hh = it.h;              // built nose-along-+X, then turned to face +Z
  const paint = mat(it.color || '#b9c0cc', {roughness:0.45, metalness:0.15});
  const glass = mat(0x30363f, {roughness:0.25, metalness:0.35});
  car.add(extrudeProfile(CAR_BODY[it.kind] || CAR_BODY.sedan, L, Hh, W*0.96, paint, true));
  car.add(extrudeProfile(CAR_CABIN[it.kind] || CAR_CABIN.sedan, L, Hh, W*0.84, glass, true));
  const wr = Hh * 0.22;
  for (const x of [L*0.32, -L*0.30]) for (const s of [-1, 1]){
    const t = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, W*0.10, 16), mat(0x22262c)));
    t.rotation.x = Math.PI/2; t.position.set(x, wr, s*W*0.44); car.add(t);
  }
  car.rotation.y = -Math.PI/2; g.add(car);
  g.add(planeMarker(it.w, it.d, COLORS.car));
  return g;
}
function legged(topW, topD, topH, h, legR, m, legM){
  const g = new THREE.Group();
  const top = shadowed(new THREE.Mesh(new THREE.BoxGeometry(topW, topH, topD), m));
  top.position.y = h - topH/2; g.add(top);
  const ix = topW/2 - legR*2, iz = topD/2 - legR*2;
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const leg = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(legR, legR*0.9, h - topH, 10), legM));
    leg.position.set(sx*ix, (h - topH)/2, sz*iz); g.add(leg);
  }
  return g;
}

// A metal material with nothing to reflect renders black, and glTF's default
// metallic factor is 1, so imported models need something around them. This is a
// plain room-ish gradient, put on the model's materials only: the studio itself
// keeps the flat look the drawings rely on.
let envTex = null;
function modelEnv(){
  if (envTex) return envTex;
  const w = 16, h = 32, data = new Uint8Array(w*h*4);
  for (let y = 0; y < h; y++){
    const t = y/(h-1);                                    // 0 = up, 1 = down
    const v = t < 0.5 ? 235 - t*180 : 120 - (t-0.5)*130;  // bright ceiling, dark floor
    for (let x = 0; x < w; x++){
      const i = (y*w+x)*4;
      data[i] = v; data[i+1] = v*0.99; data[i+2] = v*0.96; data[i+3] = 255;
    }
  }
  const src = new THREE.DataTexture(data, w, h);
  src.mapping = THREE.EquirectangularReflectionMapping; src.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  envTex = pmrem.fromEquirectangular(src).texture;
  pmrem.dispose(); src.dispose();
  return envTex;
}
// imported model: the real mesh when this device has the file, a labelled box otherwise

    const bb = new THREE.Box3().setFromObject(inst), ctr = bb.getCenter(new THREE.Vector3());
    inst.position.set(-ctr.x, -bb.min.y, -ctr.z);

      for (const m of (Array.isArray(n.material) ? n.material : [n.material])){

const fRay = new THREE.Raycaster();

const GRIP     = SVG('<circle cx="9" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.4" fill="currentColor" stroke="none"/>', 16);
// 自分でつけた名前があればそれを、無ければ種類と通し番号を
const autoName = (it, counts) => it.type === 'camera' ? camName(it)
  : it.type === 'person' ? `${personLabel(it)} ${counts[it.type]}`
  : `${NAMES[it.type]} ${counts[it.type]}`;
const listName = (it, counts) => (it.label || '').trim() || autoName(it, counts);
let renamingId = null;
function renameField(it, counts){
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'ren'; inp.maxLength = 24;
  inp.value = listName(it, counts); inp.spellcheck = false;
  let done = false;
  const commit = keep => {
    if (done) return; done = true; renamingId = null;
    if (keep){ const v = inp.value.trim(); it.label = (!v || v === autoName(it, counts)) ? undefined : v; saveHash(); }
    renderList(); renderSel(); buildDims(); needRender = true;
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') commit(true);
    else if (e.key === 'Escape') commit(false);
  });
  inp.addEventListener('blur', () => commit(true));
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
  return inp;
}
function renderList(){
  const el = document.getElementById('items'); el.innerHTML = '';
  {                                              // the room itself, edited like anything else
    const row = document.createElement('div'); row.className = 'itemrow'; row.dataset.kind = STUDIO;
    const b = document.createElement('button'); b.className = 'name'; b.classList.toggle('on', selectedId === STUDIO);
    b.innerHTML = `<span><span class="sw" style="background:#8d8f94"></span>スタジオ</span>`;
    b.addEventListener('click', () => select(STUDIO, true));
    row.append(b); el.appendChild(row);
  }
  const counts = {};
  for (const it of state.items){
    counts[it.type] = (counts[it.type]||0)+1;
    const row = document.createElement('div'); row.className = 'itemrow' + (it.hidden ? ' hidden-item' : ''); row.dataset.kind = it.type;
    const b = document.createElement('button'); b.className = 'name'; b.classList.toggle('on', it.id === selectedId);
    const sw = `<span class="sw" style="background:${itemColor(it)}"></span>`;
    // 寸法や身長は設定パネルとビューの寸法表示に出る。リストは「何がいくつあるか」だけ
    b.innerHTML = `<span>${sw}${esc(listName(it, counts))}</span>`;
    b.addEventListener('click', () => { select(it.id, true); });
    if (it.locked) row.classList.add('locked-item');
    row.dataset.id = it.id;
    if (it.id === renamingId){ row.append(renameField(it, counts)); el.appendChild(row); continue; }
    const icon = (cls, title, html, fn) => {
      const x = document.createElement('button'); x.className = cls; x.title = title; x.setAttribute('aria-label', title);
      x.innerHTML = html; x.addEventListener('click', fn); return x;
    };
    const grip = document.createElement('span'); grip.className = 'grip'; grip.innerHTML = GRIP;
    grip.title = 'ドラッグで並べ替え'; grip.setAttribute('aria-label', grip.title);
    grip.addEventListener('pointerdown', e => startReorder(e, it));
    const lock = icon('ico' + (it.locked ? ' on' : ''), it.locked ? 'ロックを外す' : 'ロック', it.locked ? LOCK_ON : LOCK_OFF, () => toggleLock(it));
    const eye = icon('ico eye', it.hidden ? '表示する' : '隠す', it.hidden ? EYE_OFF : EYE_ON,
      () => { it.hidden = !it.hidden; rebuildItems(); renderList(); renderSel(); needRender = true; saveHash(); });

}
// ---------- list: drag to reorder ----------
// つまみを掴んで上下。並び順は「カメラ 1／カメラ 2」の番号にもそのまま出る
let reorder = null;
function startReorder(e, it){
  if (viewerMode) return;
  e.preventDefault(); e.stopPropagation();
  const el = document.getElementById('items');
  const row = e.currentTarget.parentElement;
  reorder = {it, row, el, moved:false};
  row.classList.add('dragging');
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.addEventListener('pointermove', moveReorder);
  e.currentTarget.addEventListener('pointerup', endReorder);
  e.currentTarget.addEventListener('pointercancel', endReorder);
}
function reorderTarget(y){
  const rows = [...reorder.el.querySelectorAll('.itemrow[data-id]')];
  for (const r of rows){
    const b = r.getBoundingClientRect();
    if (y < b.top + b.height/2) return {row:r, before:true};
  }
  const last = rows[rows.length-1];
  return last ? {row:last, before:false} : null;
}
function moveReorder(e){
  if (!reorder) return;
  reorder.moved = true;
  for (const r of reorder.el.querySelectorAll('.itemrow')) r.classList.remove('dropbefore','dropafter');
  const t = reorderTarget(e.clientY); if (!t || t.row === reorder.row) return;
  t.row.classList.add(t.before ? 'dropbefore' : 'dropafter');
}
function endReorder(e){
  if (!reorder) return;
  const {it, el} = reorder;
  const t = reorder.moved ? reorderTarget(e.clientY) : null;
  for (const r of el.querySelectorAll('.itemrow')) r.classList.remove('dropbefore','dropafter','dragging');
  e.currentTarget.removeEventListener('pointermove', moveReorder);
  e.currentTarget.removeEventListener('pointerup', endReorder);
  e.currentTarget.removeEventListener('pointercancel', endReorder);
  reorder = null;
  if (!t || t.row.dataset.id === it.id) return;
  const from = state.items.indexOf(it);
  state.items.splice(from, 1);
  const anchor = state.items.findIndex(i => i.id === t.row.dataset.id);
  state.items.splice(anchor < 0 ? state.items.length : anchor + (t.before ? 0 : 1), 0, it);
  renderList(); renderSel(); saveHash();
}

// select
// the settings sit under the list, so selecting only has to show that tab;
// tapping on the canvas never unfolds the panel (that would shift the view mid-drag)
function select(id, open=false){
  const it = state.items.find(i => i.id === id);
  if (it?.type === 'camera') setActiveCam(id);
  selectedId = id; updateSelectionVisuals(); renderSel(); renderList();
  if (id && !viewerMode) showTab('list', open);
  needRender = true;
}

    if (it.sensor === 'custom'){

      if (savedSensors.length) h += `<div class="row saved">` + savedSensors.map((s,i) =>
        `<button class="btn ${Math.abs(s.w - sensorW(it)) < 0.01 ? 'on':''}" data-sensorpreset="${i}">${esc(s.name)}<small>${s.w}mm</small></button><button class="btn del" data-sensordel="${i}" title="${esc(s.name)} を消す" aria-label="${esc(s.name)} を消す">×</button>`).join('') + `</div>`;

  } else if (it.type === 'light'){

  el.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => { setProp(it, b.dataset.set, b.dataset.val); }));

    });

}
function deleteItem(it){
  if (!it || viewerMode) return;
  state.items = state.items.filter(i => i !== it);
  if (it.type === 'model' && it.key && !state.items.some(i => i.key === it.key)){ modelCache.delete(it.key); modelInfo.delete(it.key); idbDel(it.key); }
  if (it.id === state.activeCam) state.activeCam = firstCamId(state);
  select(null); rebuildItems(); layoutPip(); saveHash();
}
// ロックしたものは図面の上で動かない。選んで設定を見ることはできる
function toggleLock(it){
  if (!it || viewerMode) return;
  it.locked = !it.locked;
  updateSelectionVisuals(); renderList(); renderSel(); needRender = true; saveHash();
  toast(it.locked ? 'ロックしました' : 'ロックを外しました');
}
function duplicateItem(it){
  if (!it || viewerMode) return;
  const c = JSON.parse(JSON.stringify(it));
  c.id = c.type[0] + (Date.now()%100000) + (uid++);
  c.locked = false;
  setPos(c, c.x + 0.5, c.z + 0.5);
  state.items.splice(state.items.indexOf(it) + 1, 0, c);
  rebuildItems(); select(c.id); layoutPip(); needRender = true; saveHash();
}
// Delete / Backspace removes what is selected, unless a field has the keyboard
addEventListener('keydown', e => {
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  const t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  const it = sel(); if (!it) return;
  e.preventDefault();
  if (it.locked){ toast('ロック中です'); return; }
  deleteItem(it);
});

// ---------- right click / long press ----------
// 現場では指でしか触らない人もいる。長押しでも同じメニューが出る
const ctxEl = document.getElementById('ctx');
function closeCtx(){ ctxEl.hidden = true; ctxEl.innerHTML = ''; }
function openCtx(id, px, py){
  if (viewerMode) return;
  const it = state.items.find(i => i.id === id); if (!it) return;
  select(id);
  ctxEl.innerHTML = '';
  const add = (label, cls, fn) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.addEventListener('click', () => { closeCtx(); fn(); });
    ctxEl.appendChild(b);
  };
  add('名前を変更', '', () => { renamingId = it.id; renderList(); showTab('list', true); });
  add(it.locked ? 'ロックを外す' : 'ロック', '', () => toggleLock(it));
  add('複製', '', () => duplicateItem(it));
  add('削除', 'danger', () => { if (it.locked){ toast('ロック中です'); return; } deleteItem(it); });
  ctxEl.hidden = false;
  const r = ctxEl.getBoundingClientRect();
  ctxEl.style.left = Math.max(6, Math.min(px, innerWidth  - r.width  - 6)) + 'px';
  ctxEl.style.top  = Math.max(6, Math.min(py, innerHeight - r.height - 6)) + 'px';
}
addEventListener('pointerdown', e => { if (!ctxEl.hidden && !ctxEl.contains(e.target)) closeCtx(); }, true);
addEventListener('keydown', e => { if (e.key === 'Escape') closeCtx(); });
addEventListener('scroll', closeCtx, true);

// A camera at 0 should face the back wall, the way a set is normally laid out.
// Everything else keeps 0 = facing the front, so a person looks at the camera.
// Only the dial is offset; what is stored stays one convention for the whole scene.
const CAM_FACE = 180;
const rotShown = it => it.type === 'camera' ? norm(it.rot - CAM_FACE) : it.rot;
const rotStored = (it, v) => it.type === 'camera' ? norm(v + CAM_FACE) : v;
function setProp(it, k, v, live=false){
  if (['height','y','w','d','h','rot','pitch','focal','drape','sensorW','seatH','targetH'].includes(k)) v = parseFloat(v);
  if (k === 'rot') v = rotStored(it, v);
  if ((k === 'sensorW' || k === 'targetH') && !(v > 0)) return;
  if (k === 'targetH'){ const f = v / it.h; it.scale *= f; it.w *= f; it.d *= f; it.h = v; }
  else if (k === 'upFix'){ it.upFix = !!v; const t = it.d; it.d = it.h; it.h = t; }
  else if (k === 'sensor' && it.sensor !== v){ it.sensor = v; it.focal = LENSES[v][2]; if (v === 'custom' && !it.sensorW) it.sensorW = 36; }
  else it[k] = v;
  if (it.type === 'chair') it.h = Math.max(it.h, it.seatH);
  if (k === 'rot') updateItemTransform(it);
  else if (it.type === 'camera') refreshCam(it);
  else rebuildItem(it);
  if (!live){ renderSel(); renderList(); saveHash(); }
  needRender = true;
}

// files live in this browser only; the share link carries name, size and position
const IDB_NAME = 'studio3d', IDB_STORE = 'models';
function idb(){ return new Promise((res, rej) => {
  const r = indexedDB.open(IDB_NAME, 1);
  r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}); }
async function idbPut(key, val){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbGet(key){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, 'readonly'); const q = tx.objectStore(IDB_STORE).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(key){ const db = await idb(); return new Promise(res => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).delete(key); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }

const MODEL_EXT = ['glb','gltf','fbx'];
// what a "glTF Separate" or non-embedded FBX export drops next to the model file
const ASSET_EXT = ['bin','png','jpg','jpeg','webp','ktx2','basis','bmp','gif','tga','dds','tif','tiff','hdr','exr'];
const extOf = name => (String(name).split('.').pop() || '').toLowerCase();
const baseOf = name => String(name).split(/[\\/]/).pop().toLowerCase();

// The .bin and the texture images are handed to the loaders as blob URLs, so an
// export folder works with no server behind it. Anything the loader asks for and
// we do not have is recorded, so the user can be told which file is missing
// instead of watching an untextured model appear.
function assetURLs(assets){
  const urls = new Map(), made = [], missing = new Set(), used = new Set(), failed = new Set();
  for (const [name, buf] of Object.entries(assets || {})){
    const u = URL.createObjectURL(new Blob([buf])); made.push(u); urls.set(baseOf(name), u);
  }
  const manager = new THREE.LoadingManager();
  manager.onError = url => failed.add(/^([a-z]+):/i.test(url) ? url.split(':')[0] : 'その他');
  manager.setURLModifier(url => {
    if (/^(data|blob|https?):/i.test(url)) return url;
    const name = baseOf(decodeURIComponent(url.split(/[?#]/)[0]));
    const hit = urls.get(name);
    if (hit){ used.add(name); return hit; }
    missing.add(name);
    return url;                                   // let it 404; the name is already recorded
  });
  return {manager, missing, used, failed, revoke: () => made.forEach(URL.revokeObjectURL)};
}

// the glTF JSON, so we only fetch a decoder when the file actually needs one
function gltfJSON(buf, ext){
  try {
    const bytes = new Uint8Array(buf);
    if (ext === 'glb' || String.fromCharCode(...bytes.subarray(0,4)) === 'glTF'){
      const dv = new DataView(buf);
      if (dv.getUint32(0, true) !== 0x46546C67) return null;
      const len = dv.getUint32(12, true);
      return JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + len)));
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch { return null; }
}
const DECODER_BASE = 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/';
let draco = null, ktx2 = null, meshopt = null;
async function attachDecoders(loader, used){
  if (used.has('KHR_draco_mesh_compression')){
    if (!draco){
      const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
      draco = new DRACOLoader().setDecoderPath(DECODER_BASE + 'libs/draco/gltf/');
    }
    loader.setDRACOLoader(draco);
  }
  if (used.has('KHR_texture_basisu')){
    if (!ktx2){
      const { KTX2Loader } = await import('three/addons/loaders/KTX2Loader.js');
      ktx2 = new KTX2Loader().setTranscoderPath(DECODER_BASE + 'libs/basis/').detectSupport(renderer);
    }
    loader.setKTX2Loader(ktx2);
  }
  if (used.has('EXT_meshopt_compression')){
    if (!meshopt) meshopt = (await import('three/addons/libs/meshopt_decoder.module.js')).MeshoptDecoder;
    loader.setMeshoptDecoder(meshopt);
  }
}
// loaders are pulled in only when someone actually imports something
async function parseModel(buf, ext, assets){
  const {manager, missing, used, failed, revoke} = assetURLs(assets);
  try {
    let obj, json = null;
    if (ext === 'glb' || ext === 'gltf'){
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      const loader = new GLTFLoader(manager);
      // three reads embedded textures with ImageBitmapLoader, which fetch()es the
      // blob: URL. Where fetch is shut but an <img> is not, read them that way
      // instead of silently losing every texture in the file.
      const cap = await imageCaps();
      if (!cap.fetch && cap.blob) loader.register(parser => {
        const tl = new THREE.TextureLoader(parser.options.manager);
        tl.crossOrigin = undefined;                 // blob: and data: need no CORS check
        parser.textureLoader = tl;
        return {name:'STUDIO_texture_via_img'};
      });
      json = gltfJSON(buf, ext);
      try { await attachDecoders(loader, new Set(json?.extensionsUsed || [])); }
      catch(e){ console.warn('decoder setup failed', e); throw new Error('compressed'); }
      obj = await new Promise((res, rej) => loader.parse(buf, '', r => res(r.scene), rej));
    } else {
      const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
      obj = new FBXLoader(manager).parse(buf, '');
    }
    await new Promise(r => setTimeout(r, 0));       // let queued texture loads settle
    return {obj, json, missing:[...missing], used:[...used], failed:[...failed]};
  } finally { setTimeout(revoke, 20000); }          // textures decode asynchronously
}
// how much of the model actually arrived, so the panel can say so plainly.
// any texture-valued property counts: a fixed list of map names misses the rest.
// the glTF side is counted too, so "no texture" and "the texture never reached
// the material" can be told apart.
function inspectModel(obj, json){
  let meshes = 0; const maps = new Set(), kinds = new Set();
  obj.traverse(n => {
    if (!n.isMesh) return;
    meshes++;
    for (const m of (Array.isArray(n.material) ? n.material : [n.material])){
      if (!m) continue;
      kinds.add(m.type);
      for (const k in m) if (m[k] && m[k].isTexture) maps.add(m[k].uuid);
    }
  });
  return {meshes, textures:maps.size, kinds:[...kinds], ...gltfFacts(json),
          images: json?.images?.length || 0, exts: json?.extensionsUsed || []};
}
// what the file itself claims, so "the exporter never linked them" can be told
// apart from "the link is there but the image would not load"
function gltfFacts(json){
  if (!json) return {};
  const imgs = json.images || [], mats = json.materials || [];
  let prims = 0, noMat = 0;
  for (const m of json.meshes || []) for (const p of m.primitives || []){ prims++; if (p.material === undefined) noMat++; }
  let refs = 0;
  const walk = o => { for (const k in o){ const v = o[k];
    if (v && typeof v === 'object'){ if (/[Tt]exture$/.test(k) && v.index !== undefined) refs++; else walk(v); } } };
  for (const m of mats) walk(m);
  return {defs:(json.textures || []).length, mats:mats.length, prims, noMat, refs,
          mimes:[...new Set(imgs.map(i => i.mimeType || (i.uri ? `外部 ${baseOf(i.uri)}` : '種類不明')))]};
}
// glTF hands a texture embedded in a GLB to three as a blob: URL, and a sandboxed
// page does not always allow every way of reading one back. Measure it once with a
// 1x1 PNG instead of guessing, and let the result pick the loader below.
const PROBE_PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC';
let caps = null;
async function imageCaps(){
  if (caps) return caps;
  try {
    const bytes = Uint8Array.from(atob(PROBE_PNG), c => c.charCodeAt(0));
    const blob = new Blob([bytes], {type:'image/png'});
    const burl = URL.createObjectURL(blob);
    const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = src; });
    const ok = p => p.then(() => true, () => false);
    caps = {data: await img('data:image/png;base64,' + PROBE_PNG), blob: await img(burl),
            fetch: await ok(fetch(burl)), bitmap: await ok(createImageBitmap(blob))};
    URL.revokeObjectURL(burl);
  } catch(e){ caps = {data:true, blob:true, fetch:true, bitmap:true, failed:true}; }
  return caps;
}
const yn = v => v ? '可' : '不可';
const capsText = c => c ? `data ${yn(c.data)}・blob ${yn(c.blob)}・fetch ${yn(c.fetch)}・bitmap ${yn(c.bitmap)}` : '';
const sizeOf = obj => new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
async function importFiles(files){
  const mains = [], sides = [];
  for (const f of files){
    const ext = extOf(f.name);
    if (MODEL_EXT.includes(ext)) mains.push(f);
    else if (ASSET_EXT.includes(ext)) sides.push(f);
    else if (files.length === 1) toast(`${f.name} は読めない種類です`);
  }
  if (!mains.length){
    toast(sides.length ? 'GLB / glTF / FBX の本体も一緒に選んでください' : 'GLB / glTF / FBX を選んでください');
    return;
  }
  const assets = {};
  let sideBytes = 0;
  for (const f of sides){
    if (sideBytes + f.size > 120*1024*1024){ toast('付属ファイルが多すぎるので一部を読みませんでした'); break; }
    sideBytes += f.size;
    assets[f.name] = await f.arrayBuffer();
  }
  const sliceAll = () => Object.fromEntries(Object.entries(assets).map(([k,v]) => [k, v.slice(0)]));
  for (const f of mains){
    if (f.size > 60*1024*1024){ toast(`${f.name} は大きすぎます（60MB まで）`); continue; }
    const ext = extOf(f.name);
    toast(`${f.name} を読み込み中`);
    try {
      const buf = await f.arrayBuffer();
      const {obj, json, missing, used, failed} = await parseModel(buf.slice(0), ext, sliceAll());
      const raw = sizeOf(obj), max = Math.max(raw.x, raw.y, raw.z);
      if (!(max > 0)){ toast(`${f.name} に形がありません`); continue; }
      let scale = 1;                                  // glTF is metres by spec; FBX units vary
      if (ext === 'fbx'){ if (max > 5000) scale = 0.001; else if (max > 100) scale = 0.01; }
      const key = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      modelCache.set(key, obj);
      const info = {...inspectModel(obj, json), missing, failed};
      if (info.meshes && !info.textures && info.refs) info.probe = capsText(await imageCaps());
      modelInfo.set(key, info);
      // keep only the files this model actually asked for, not the whole dropped folder
      const keep = Object.fromEntries(Object.entries(assets).filter(([n]) => used.includes(baseOf(n))));
      await idbPut(key, {buf, ext, name:f.name, assets:keep}).catch(() => toast('この端末に保存できませんでした'));
      addItem('model', {key, name:f.name, scale, upFix:false,
        w:+(raw.x*scale).toFixed(3), d:+(raw.z*scale).toFixed(3), h:+(raw.y*scale).toFixed(3)});
      const note = textureNote(key);
      if (note) toast(note);
      else if (f.size > 15*1024*1024) toast(`${f.name} は重いのでスマホでは動きが鈍くなります`);
      else if (max*scale > 60 || max*scale < 0.02) toast('大きさが怪しいので「高さ」で直してください');
    } catch(e){
      console.warn('import failed', e);
      toast(e?.message === 'compressed' ? `${f.name} は圧縮形式で、変換部品を取りに行けませんでした`
        : ext === 'gltf' ? `${f.name} を読めませんでした。.bin とテクスチャも一緒に選んでください`
        : `${f.name} を読めませんでした`);
    }
  }
}
// three.js dropped spec/gloss in r155; files written that way arrive untextured
const SPEC_GLOSS = 'KHR_materials_pbrSpecularGlossiness';
// one line for the panel and the toast; null when the model came in whole
function textureNote(key){
  const info = modelInfo.get(key); if (!info) return null;
  if (info.missing?.length) return `${info.missing.slice(0,3).join('・')} が見つかりません。一緒に選ぶかフォルダごとドラッグしてください`;
  if (!info.meshes || info.textures) return null;
  if (info.exts?.includes(SPEC_GLOSS)) return '古い形式（スペキュラ／グロス）のマテリアルなので three.js が読めません。メタリック／ラフネスで書き出し直してください';
  if (info.noMat) return `${info.noMat} 個の面にマテリアルが割り当たっていません。書き出しの前にマテリアルを付け直してください`;
  if (info.images && !info.refs) return `画像は ${info.images} 枚ありますが、マテリアルから参照されていません。書き出し設定でテクスチャがマテリアルに結び付いていない状態です`;
  if (info.images) return `画像 ${info.images} 枚を読み込めませんでした（${(info.mimes||[]).join('・')}）`;
  return 'テクスチャが入っていません。書き出しでテクスチャを埋め込んでください';
}
// the raw facts, for when the note above is not enough to explain a file
function textureDetail(key){
  const i = modelInfo.get(key); if (!i) return '';
  const bits = [`メッシュ ${i.meshes}`, `テクスチャ ${i.textures}`];
  if (i.prims != null) bits.push(`面 ${i.prims}（材質未指定 ${i.noMat}）`);
  if (i.images) bits.push(`画像 ${i.images}`, `テクスチャ定義 ${i.defs}`, `マテリアル ${i.mats}`, `参照 ${i.refs}`);
  if (i.mimes?.length) bits.push(i.mimes.join('・'));
  if (i.failed?.length) bits.push(`失敗 ${i.failed.join('・')}`);
  if (i.probe) bits.push(i.probe);
  if (i.kinds?.length) bits.push(i.kinds.join('・'));
  if (i.exts?.length) bits.push(i.exts.join(' / '));
  return bits.join('　');
}
async function restoreModels(){
  const keys = [...new Set(state.items.filter(i => i.type === 'model' && i.key).map(i => i.key))];
  let any = false;
  for (const key of keys){
    if (modelCache.has(key)) continue;
    try {
      const rec = await idbGet(key); if (!rec) continue;
      const assets = Object.fromEntries(Object.entries(rec.assets || {}).map(([k,v]) => [k, v.slice(0)]));
      const {obj, json, missing, failed} = await parseModel(rec.buf.slice(0), rec.ext, assets);
      modelCache.set(key, obj); modelInfo.set(key, {...inspectModel(obj, json), missing, failed}); any = true;
    } catch(e){ console.warn('model restore failed', e); }
  }
  if (any){ rebuildItems(); renderList(); renderSel(); needRender = true; }
}
// a dropped folder (the shape C4D and Blender write) is walked for its files
async function filesFromDrop(dt){
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async e => {
    if (out.length > 400) return;
    if (e.isFile) out.push(await new Promise((res, rej) => e.file(res, rej)));
    else if (e.isDirectory){
      const rd = e.createReader();
      for (;;){
        const batch = await new Promise((res, rej) => rd.readEntries(res, rej));
        if (!batch.length) break;
        for (const c of batch) await walk(c);
      }
    }
  };
  for (const e of entries) await walk(e).catch(() => {});
  return out;
}

for (const ev of ['dragenter','dragover']) viewEl.addEventListener(ev, e => { if (!dragHasFiles(e)) return; e.preventDefault(); if (!viewerMode) viewEl.classList.add('drop'); });
for (const ev of ['dragleave','drop']) viewEl.addEventListener(ev, e => { e.preventDefault(); viewEl.classList.remove('drop'); });
viewEl.addEventListener('drop', e => {

  filesFromDrop(dt).then(fs => { if (fs.length) importFiles(fs); });
});

function b64u(bytes){ let s=''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function encode(){
  const json = JSON.stringify(state); const bytes = new TextEncoder().encode(json);
  if (typeof CompressionStream !== 'undefined'){
    const cs = new CompressionStream('deflate-raw'); const wr = cs.writable.getWriter(); wr.write(bytes); wr.close();
    const out = new Uint8Array(await new Response(cs.readable).arrayBuffer()); return 'z' + b64u(out);
  }
  return 'j' + b64u(bytes);
}
async function decode(s){
  const kind = s[0], body = unb64u(s.slice(1));
  let bytes = body;
  if (kind === 'z'){ const ds = new DecompressionStream('deflate-raw'); const wr = ds.writable.getWriter(); wr.write(body); wr.close(); bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}

  return false;
}

}

// ---------- handing a file to the viewer ----------
// A plain <a download> is inert inside the claude.ai preview frame, which is where
// this gets tried first, so a file goes through the viewer's own save when there is
// one and through the link everywhere else. The lookup is started at boot because
// it can sit for ten seconds when nothing answers.
let downloadsNS = null;
function findDownloads(){
  downloadsNS = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
}
// asking for the name ourselves, for the places that have no save dialog of their own

let nameResolve = null;

// A file must never appear in the download folder unasked: saving always names it
// first. Chrome and Edge on the desktop open the real 名前を付けて保存 dialog, which
// also lets the folder be chosen; everywhere else the name is asked for here.
async function saveFile(filename, blob, mime){
  const ext = filename.slice(filename.lastIndexOf('.'));
  if (window.showSaveFilePicker){
    try {
      const h = await window.showSaveFilePicker({suggestedName:filename,
        types:[{description:ext.slice(1).toUpperCase(), accept:{[mime]:[ext]}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close();
      toast('保存しました'); return;
    } catch(e){
      if (e?.name === 'AbortError') return;      // the dialog was closed on purpose
      // blocked instead: inside a preview frame, or without a fresh click. ask below
    }
  }
  let name = await askName(filename);
  if (!name) return;
  if (!name.includes('.')) name += ext;
  const ns = downloadsNS ? await downloadsNS : null;
  if (ns){
    try { await ns.save({filename:name, data:blob}); toast('保存しました'); }
    catch(e){ if (e?.code !== 'declined') toast('保存できませんでした'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('保存しました');
}

// ---------- project file ----------
// The link covers a quick hand-off; a job that comes back next month wants a file
// on the desktop. Same JSON as the link, uncompressed so it stays readable.
function projectName(){
  const m = state.meta;
  return [m.project, m.cut, new Date().toISOString().slice(0,10)].filter(Boolean).join('_') || 'StudioPlanner';
}
document.getElementById('savefile').addEventListener('click', () => {
  saveFile(projectName() + '.json', new Blob([JSON.stringify(state, null, 1)], {type:'application/json'}), 'application/json');
});
document.getElementById('loadfile').addEventListener('click', () => document.getElementById('projfile').click());

    state = migrate(st);

    buildStudio(); rebuildItems(); renderList(); renderSel(); renderMeta(); layoutPip(); saveHash(); needRender = true;
    restoreModels();                                  // models already in this browser come back

  } catch(err){ console.warn('project load failed', err); toast('このファイルは読めません'); }
});

document.getElementById('edit').addEventListener('click', () => { viewerMode = false; document.body.classList.remove('viewer'); if (mainView === 'cam') setMain('plan'); resize(); saveHash(); });

// png
// Printed at A4 a screen-sized shot is mush, so this renders at twice the pixels.
// The numbers are HTML on screen and would be missing from the image, so they are
// painted onto a copy of the canvas here.
const PNG_SCALE = 2;
function pill(ctx, x, y, w, h, r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); return; }
  ctx.fillRect(x, y, w, h);
}
function capture(view, name){
  const prevMain = mainView, pr = renderer.getPixelRatio();
  mainView = view;
  renderer.setPixelRatio(pr * PNG_SCALE);
  fitOrtho();
  renderView(view, mainRect(), true);                 // isMain draws the dimensions
  renderer.setScissorTest(false);
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const ctx = out.getContext('2d');
  ctx.drawImage(canvas, 0, 0);
  const k = out.width / Math.max(1, W);               // image pixels per CSS pixel
  ctx.font = `600 ${Math.round(12*k)}px "IBM Plex Mono", ui-monospace, monospace`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  for (const L of labelPositions(view, mainCam(), mainRect(), false)){
    const x = L.x*k, y = L.y*k, tw = ctx.measureText(L.text).width, h = 21*k;
    ctx.fillStyle = L.cls === 'dist' ? 'rgba(180,101,24,.95)' : 'rgba(20,22,26,.88)';
    pill(ctx, x - tw/2 - 7*k, y - h/2, tw + 14*k, h, 5*k);
    ctx.fillStyle = L.cls === 'dim' ? '#ffd9a8' : '#ffffff';
    ctx.fillText(L.text, x, y);
  }
  const url = out.toDataURL('image/png');
  renderer.setPixelRatio(pr); mainView = prevMain; resize();
  const s = document.getElementById('shot'); document.getElementById('shotimg').src = url; document.getElementById('shotname').textContent = `${name}（${out.width} × ${out.height} px）`;
  out.toBlob(b => { shotBlob = b; shotName = `${projectName()}_${name}.png`; }, 'image/png');
  s.classList.add('show');
}
let shotBlob = null, shotName = 'studio.png';
document.getElementById('shotdl').addEventListener('click', () => { if (shotBlob) saveFile(shotName, shotBlob, 'image/png'); });
const VIEW_NAME = {plan:'上面', side:'側面', pers:'パース', cam:'ファインダー'};
document.getElementById('png').addEventListener('click', () => capture(mainView, VIEW_NAME[mainView]));
document.getElementById('shotclose').addEventListener('click', () => document.getElementById('shot').classList.remove('show'));

let toastT; function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

// ---------- PDF sheet ----------
// Japanese needs real fonts, so the sheet is HTML laid out in mm and handed to the
// browser's own print-to-PDF. jsPDF would have to embed a multi-MB CJK font to match.
// The dimension labels stay HTML on top of each image, so they print as text.
let orient = 'landscape';
try { const o = localStorage.getItem('studio3d.orient'); if (o === 'portrait' || o === 'landscape') orient = o; } catch {}
const paperEl = document.getElementById('paper'), paperModal = document.getElementById('papermodal');
const pageStyle = document.createElement('style'); document.head.appendChild(pageStyle);

// render one view off-screen at print resolution and return its labels as percentages
function captureView(view, cw, ch){
  const oW = W, oH = H, oMain = mainView;
  capturing = true; mainView = view;
  // scene.background is painted by render() over any clear colour, so the light
  // paper surround has to be swapped in here. The finder keeps the app's dark void.
  const oBg = scene.background;
  if (view !== 'cam') scene.background = new THREE.Color(0xdfe2e7);
  renderer.setSize(cw, ch, false); W = cw; H = ch;
  persCam.aspect = cw / ch; persCam.updateProjectionMatrix();   // layoutPip only knows the screen aspect
  fitOrtho();
  const rect = {x:0, y:0, w:cw, h:ch};
  renderView(view, rect, true);                                 // isMain so the dimension ribbons draw
  renderer.setScissorTest(false);
  const url = canvas.toDataURL('image/png');
  const cam = view==='plan' ? planCam : view==='side' ? sideCam : view==='pers' ? persCam : shotCam;
  const labs = labelPositions(view, cam, rect, false, 19, 29).map(L => ({x:L.x/cw*100, y:L.y/ch*100, text:L.text, cls:L.cls}));
  capturing = false; scene.background = oBg; mainView = oMain; W = oW; H = oH;
  renderer.setSize(oW, oH, false); layoutPip(); fitOrtho(); needRender = true;
  return {url, labels:labs};
}
const prow = (k, v) => `<div class="prow"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
function cameraRows(){
  const ci = camItem();
  if (!ci) return prow('カメラ', '未配置');
  const eq = equiv(ci);
  let h = prow('センサー', `${sensorName(ci)}  ${sensorW(ci)} mm`);
  h += prow('レンズ', `${ci.focal} mm${eq ? `（35mm換算 ${eq} mm）` : ''}`);
  h += prow('画面比率', ci.aspect);
  h += prow('水平画角', `${THREE.MathUtils.radToDeg(hfov(ci)).toFixed(1)}°`);
  h += prow('カメラ高さ', `${ci.y.toFixed(2)} m`);
  h += prow('上下の向き', `${ci.pitch}°`);
  h += prow('パン', `${rotShown(ci)}°（0° で奥）`);
  h += prow('立ち位置', `左右 ${ci.x >= 0 ? '+' : ''}${ci.x.toFixed(2)} / 前後 ${ci.z >= 0 ? '+' : ''}${ci.z.toFixed(2)} m`);
  const back = state.studio.d/2 + ci.z;
  h += prow('奥壁まで', `${back.toFixed(2)} m`);
  const people = state.items.filter(i => i.type === 'person' && !i.hidden);
  if (people.length){
    const d = Math.min(...people.map(p => Math.hypot(p.x - ci.x, p.z - ci.z)));
    h += prow('最寄りの被写体まで', `${d.toFixed(2)} m`);
  }
  const others = cams().filter(c => c !== ci);
  if (others.length) h += prow('他のカメラ', others.map(c => `${camName(c)} ${c.focal}mm`).join('、'));
  return h;
}
function studioRows(){
  const s = state.studio, cv = s.cove;
  const edges = [cv.back && '奥', cv.left && '左', cv.right && '右'].filter(Boolean);
  let h = prow('スタジオ', `幅 ${fmt(s.w)} × 奥行 ${fmt(s.d)} × 高 ${fmt(s.h)} m`);
  h += prow('ホリゾント', edges.length ? edges.join('・') : 'なし');
  const people = state.items.filter(i => i.type === 'person' && !i.hidden);
  if (people.length) h += prow('人物', people.map(p => `${personLabel(p)} ${fmt(p.height)}m`).join('、'));
  const props = state.items.filter(i => !i.hidden && ['car','chair','table','box','model','mirror'].includes(i.type));
  if (props.length) h += prow('小道具', [...new Set(props.map(p => itemName(p)))].join('、'));
  // backdrops get a line each: on set, the exact cloth size is what people ask for
  const cloths = state.items.filter(i => i.type === 'chroma' && !i.hidden);
  cloths.forEach((c, i) => h += prow(cloths.length > 1 ? `背景布 ${i+1}` : '背景布',
    `幅 ${num(c.w)} × 高 ${num(c.h)}${c.drape > 0 ? ` × 床 ${num(c.drape)}` : ''} m`));
  const lights = state.items.filter(i => i.type === 'light' && !i.hidden);
  if (lights.length) h += prow('ライト', `${lights.length} 灯`);
  return h;
}
function buildSheet(){
  const land = orient === 'landscape', m = state.meta, ci = camItem();
  const [cw, ch] = land ? [1092, 1038] : [1140, 852];   // 12 px/mm at the panel size, about 300 dpi
  const shots = [['plan','上面'],['side','側面'],['pers','パース'],['cam', ci ? `ファインダー（${camName(ci)}）` : 'ファインダー']]
    .map(([v, name]) => ({view:v, name, ...captureView(v, cw, ch)}));
  const stamp = new Date().toLocaleString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
  const panels = shots.map(sh =>
    `<div class="pv" data-pane="${sh.view}"><div class="pvin" style="${frameCSS(sh.view)}">` +
    `<img src="${sh.url}" alt="${esc(sh.name)}" draggable="false">` +
    sh.labels.map(L => `<span class="lb ${L.cls}" style="left:${L.x.toFixed(2)}%;top:${L.y.toFixed(2)}%">${L.text}</span>`).join('') +
    `</div><span class="cap">${esc(sh.name)}</span></div>`).join('');
  paperEl.className = orient;
  paperEl.innerHTML =
    `<div class="ph">
       <div class="pj"><em>PROJECT</em>${esc(m.project || '案件名未入力')}</div>
       ${m.cut ? `<div class="cut">${esc(m.cut)}</div>` : ''}
       <div class="meta">出力 ${esc(stamp)}<br>Studio Planner</div>
     </div>
     <div class="pbody">
       <div class="pviews">${panels}</div>
       <div class="pside">
         <div class="pbox"><h4>${esc(ci ? camName(ci) : 'カメラ')}</h4><div class="inner">${cameraRows()}</div></div>
         <div class="pbox"><h4>スタジオ・被写体</h4><div class="inner">${studioRows()}</div></div>
         <div class="pbox pmemo"><h4>メモ</h4><div class="inner">${esc(m.memo || '')}</div></div>
       </div>
     </div>
     <div class="pfoot"><span>1 マス = 1 m。寸法は概算です。</span><span>${esc(m.project || '')} ${esc(m.cut || '')}</span></div>`;
  pageStyle.textContent = `@page { size: A4 ${orient}; margin: 8mm; }`;
}
const frameOf = v => (state.meta.frames[v] ||= {s:1, x:0, y:0});
const frameCSS = v => { const f = frameOf(v); return `transform:translate(${f.x.toFixed(2)}%,${f.y.toFixed(2)}%) scale(${f.s.toFixed(3)})`; };
function applyFrame(v){
  const el = paperEl.querySelector(`.pv[data-pane="${v}"] .pvin`);
  if (el) el.style.cssText = frameCSS(v);
}
// the sheet is drawn at full A4 and then scaled to fit the screen, so a drag in
// screen pixels has to be divided by that scale before it means anything on paper
let paperScale = 1;
{
  let drag = null;
  // The finder is left alone on purpose. Panning or zooming it would show a frame
  // the camera does not actually take, which is the one error this sheet must not make.
  const pane0 = e => { const p = e.target.closest?.('.pv[data-pane]'); return p && p.dataset.pane !== 'cam' ? p : null; };
  paperEl.addEventListener('pointerdown', e => {
    const pane = pane0(e); if (!pane) return;
    const v = pane.dataset.pane, box = pane.getBoundingClientRect();
    pane.setPointerCapture(e.pointerId);
    drag = {v, box, x:e.clientX, y:e.clientY, f:{...frameOf(v)}};
    e.preventDefault();
  });
  paperEl.addEventListener('pointermove', e => {
    if (!drag) return;
    // box is the panel on screen, and a translate percentage lands on the same
    // scaled size, so the page scale cancels and the ratio is all that is needed
    const f = frameOf(drag.v);
    f.x = drag.f.x + (e.clientX - drag.x) / drag.box.width * 100;
    f.y = drag.f.y + (e.clientY - drag.y) / drag.box.height * 100;
    applyFrame(drag.v);
  });
  const stop = () => { if (drag){ drag = null; saveHash(); } };
  paperEl.addEventListener('pointerup', stop);
  paperEl.addEventListener('pointercancel', stop);
  paperEl.addEventListener('wheel', e => {
    const pane = pane0(e); if (!pane) return;
    e.preventDefault();
    const f = frameOf(pane.dataset.pane);
    f.s = clamp(f.s * (e.deltaY < 0 ? 1.12 : 0.893), 0.4, 6);
    applyFrame(pane.dataset.pane); saveHash();
  }, {passive:false});
  paperEl.addEventListener('dblclick', e => {
    const pane = pane0(e); if (!pane) return;
    state.meta.frames[pane.dataset.pane] = {s:1, x:0, y:0};
    applyFrame(pane.dataset.pane); saveHash();
  });
}
document.getElementById('framereset').addEventListener('click', () => {
  state.meta.frames = {};
  for (const v of ['plan','side','pers']) applyFrame(v);
  saveHash();
});
function fitPaper(){
  const box = paperEl.parentElement.getBoundingClientRect();
  const k = Math.min(1, (box.width - 24) / Math.max(1, paperEl.offsetWidth));
  paperScale = k;
  paperEl.style.transform = `scale(${k.toFixed(3)})`;
  paperEl.parentElement.style.height = k < 1 ? `${paperEl.offsetHeight * k + 40}px` : '';
}
document.querySelectorAll('[data-orient]').forEach(b => b.addEventListener('click', () => {
  orient = b.dataset.orient;
  document.querySelectorAll('[data-orient]').forEach(x => x.classList.toggle('on', x.dataset.orient === orient));
  try { localStorage.setItem('studio3d.orient', orient); } catch {}
}));
for (const [id, key] of [['m-project','project'], ['m-cut','cut'], ['m-memo','memo']]){
  const el = document.getElementById(id);
  el.addEventListener('input', () => { state.meta[key] = el.value; saveHash(); });
}
function renderMeta(){
  document.getElementById('m-project').value = state.meta.project || '';
  document.getElementById('m-cut').value = state.meta.cut || '';
  document.getElementById('m-memo').value = state.meta.memo || '';
  document.querySelectorAll('[data-orient]').forEach(x => x.classList.toggle('on', x.dataset.orient === orient));
}
document.getElementById('makepdf').addEventListener('click', () => {
  buildSheet(); paperModal.classList.add('show'); requestAnimationFrame(fitPaper);
});
document.getElementById('paperclose').addEventListener('click', () => paperModal.classList.remove('show'));
document.getElementById('doprint').addEventListener('click', () => {
  const m = state.meta, keep = document.title;
  const name = [m.project, m.cut, new Date().toISOString().slice(0,10)].filter(Boolean).join('_');
  document.title = name || 'StudioPlanner';          // browsers name the PDF after the title
  window.print();
  setTimeout(() => { document.title = keep; }, 1000);
});
addEventListener('resize', () => { if (paperModal.classList.contains('show')) fitPaper(); });

// ---------- boot ----------
document.documentElement.lang = 'ja';     // there is no <html> tag of ours to put it on
// a hook for test/run.mjs, which otherwise cannot see whether what was drawn is the
// right size. Nothing in the app reads it.
window.__sp = {THREE, renderer, scene, gizmo, camera: () => mainCam(), state: () => state, group: id => itemObjs.get(id)?.group || null, pick, sel: () => selectedId, select, orbit, render: () => { needRender = true; }};
(async () => {
  findDownloads();
  await loadHash();
  viewerMode = /m=v/.test(location.hash);
  if (viewerMode){ document.body.classList.add('viewer'); mainView = 'cam'; }
  syncViewBtns();
  buildStudio(); rebuildItems(); renderList(); renderSel(); renderMeta();
  new ResizeObserver(resize).observe(viewEl); resize();
  document.getElementById('linkbox').value = location.href;
  frame();
  restoreModels();
})();
</script>
