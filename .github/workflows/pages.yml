# main に push するたび、そのまま GitHub Pages に出る。ビルドは無い。
# enablement: true があるので、リポジトリの Pages 設定を手で入れる必要も無い。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # 開発用のものは出さない。models/ のような新しい素材は黙って入るようにしておく
      - name: Collect the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                --exclude 'test' --exclude 'tools' --exclude 'docs' \
                --exclude 'CLAUDE.md' --exclude '.gitignore' ./ _site/
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
