# main に push するたび、そのまま GitHub Pages に出る。ビルドは無い。
#
# 最初の 1 回だけ、リポジトリの Settings → Pages → Source を
# 「GitHub Actions」にする必要がある。GITHUB_TOKEN には Pages サイトを
# 新規作成する権限が無く、configure-pages の enablement では入らなかった
# （Resource not accessible by integration）。一度入れれば以降は自動。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 開発用のものは出さない。models/ のような新しい素材は黙って入る
      - name: Collect the site
        run: |
          mkdir -p _site
          for f in * .nojekyll; do
            case "$f" in test|tools|docs|_site|CLAUDE.md) continue ;; esac
            [ -e "$f" ] && cp -r "$f" _site/
          done
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
